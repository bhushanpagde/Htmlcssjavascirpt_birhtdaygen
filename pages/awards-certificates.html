<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awards &amp; Certificates - HR Canvas</title>
    <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/sidebar.css"><link rel="stylesheet" href="../css/birthday-cards.css"><link rel="stylesheet" href="../css/awards-certificates.css"><link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/navigation.js" defer data-root="../" data-page="awards-certificates"></script><script src="../js/vendor/certificate-template-data.js" defer></script><script src="../js/vendor/certificate-html-template.js" defer></script><script src="../js/awards-certificates.js" defer></script>
</head>
<body>
    <main class="cards-page certificate-page">
        <header class="cards-header"><div><h1>🏆 Awards &amp; Certificates</h1><p>Create personalized Star Performer certificates for employees.</p></div><button class="button button-primary" id="newCertificateButton" type="button">＋ New Certificate</button></header>
        <div class="notice" id="notice" hidden role="alert"></div>
        <section class="content-section"><div class="section-heading"><div><h2>Generated Certificates</h2><p id="certificateCount">0 certificates</p></div><input class="search-input" id="certificateSearch" type="search" placeholder="Search employee…" aria-label="Search certificates by employee"></div><div class="empty-state info" id="certificateEmpty">No certificates have been generated yet.</div><div class="certificate-grid" id="certificateGrid"></div></section>
    </main>
    <dialog class="certificate-form-dialog" id="certificateDialog"><form id="certificateForm"><div class="dialog-heading"><h2>New Certificate</h2><button class="icon-button" id="certificateClose" type="button" aria-label="Close">×</button></div><label>Employee Name<select id="employeeSelect" required><option value="">Select an employee</option></select></label><label>Unit Head Name<input id="unitHeadName" type="text" required placeholder="Enter the Unit Head name"></label><label>Certificate Matter<textarea id="certificateMatter" rows="6" required placeholder="Enter the recognition or achievement matter to display on the certificate"></textarea></label><div class="dialog-actions"><button class="button button-secondary" id="certificateCancel" type="button">Cancel</button><button class="button button-primary" type="submit">Generate Certificate</button></div></form></dialog>
    <dialog class="certificate-preview-dialog" id="previewDialog"><button class="dialog-close" id="previewClose" type="button" aria-label="Close preview">×</button><img id="previewImage" alt="Certificate preview"><div class="dialog-footer"><strong id="previewName"></strong><div class="preview-actions"><button class="button button-secondary" id="previewSend" type="button">Send Email</button></div></div></dialog>
</body></html>
